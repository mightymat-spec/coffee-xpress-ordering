<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Express - Order</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      margin: 0;
      padding: 20px;
      color: #f8fafc;
    }
    .order-card {
      max-width: 500px;
      margin: 20px auto;
      background: #1e293b;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid #334155;
    }
   <div class="brand-header">
      <img src="https://static.wixstatic.com/media/a95f92_f6eb05f013144a2b97bebf956ae53526~mv2.png" alt="Gemco Players Logo" class="brand-logo" style="max-width: 180px; height: auto; display: block; margin: 0 auto 12px auto;">
      <h2>Coffee Express</h2>
    </div>
.charity-banner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #162e21;
      border: 1px solid #22c55e;
      color: #4ade80;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
      text-align: left;
    }
    <div class="charity-banner">
      <img src="https://static.wixstatic.com/media/a95f92_e4c84a0d9be44983a54a7bc9ba3c4033~mv2.png" alt="ACNC Registered Charity Tick" style="height: 32px; width: auto; flex-shrink: 0;">
      <span>All proceeds support the Gem Community Arts Centre</span>
    </div>
      text-align: center;
      margin-bottom: 20px;
    }
    .brand-logo {
      max-width: 160px;
      height: auto;
      margin-bottom: 12px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    h2 {
      margin: 0 0 6px 0;
      color: #ffffff;
      font-size: 24px;
    }
    .charity-banner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #162e21;
      border: 1px solid #22c55e;
      color: #4ade80;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
      text-align: center;
    }
    .charity-banner svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: #4ade80;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    .payment-notice {
      background: #0284c7;
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .hours-info {
      background: #334155;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 20px;
      text-align: center;
    }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; color: #e2e8f0; }
    input, select, textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #ffffff;
      border-radius: 8px;
      font-size: 15px;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .total-box {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 14px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 18px;
      color: #38bdf8;
      margin-bottom: 20px;
    }
    button {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #64748b; cursor: not-allowed; }
    .status-msg { margin-top: 15px; text-align: center; font-weight: 600; }
    .success { color: #4ade80; }
    .error { color: #f87171; }
  </style>
</head>
<body>

  <div class="order-card">
    <div class="brand-header">
      <img src="https://www.gemcoplayers.org/uploads/1/3/3/0/133036660/published/gemco-logo.png" alt="Gemco Players Logo" class="brand-logo" onerror="this.onerror=null; this.src='https://www.gemcoplayers.org/uploads/1/3/3/0/133036660/gemco-logo-header.png';">
      <h2>Coffee Express</h2>
    </div>

    <div class="charity-banner">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
      <span>All proceeds support the Gem Community Arts Centre</span>
    </div>

    <div class="payment-notice">
      💳 Payment on Pick Up
    </div>

    <div class="hours-info">
      📅 Open Tuesday & Thursday mornings (8:00 AM – 11:00 AM) during school terms.
    </div>

    <form id="order-form">
      <div class="form-group">
        <label for="customerName">Your Name</label>
        <input type="text" id="customerName" required placeholder="Enter your name">
      </div>

      <div class="form-group">
        <label for="coffeeType">Coffee / Drink Type</label>
        <select id="coffeeType" required>
          <option value="">Loading menu...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="size">Size</label>
        <select id="size" required>
          <option value="Small (8oz)" data-price="0">Small (8oz)</option>
          <option value="Large (12oz)" data-price="1.00">Large (12oz) (+ $1.00)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="pickupTime">Pickup Time (8:00 AM – 11:00 AM)</label>
        <select id="pickupTime" required>
          <option value="">-- Select Pickup Time --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="milk">Milk Choice</label>
        <select id="milk">
          <option value="Full Cream" data-price="0">Full Cream</option>
          <option value="Skim Milk" data-price="0">Skim Milk</option>
          <option value="Oat Milk" data-price="0.70">Oat Milk (+ $0.70)</option>
          <option value="Almond Milk" data-price="0.70">Almond Milk (+ $0.70)</option>
          <option value="Soy Milk" data-price="0.70">Soy Milk (+ $0.70)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="syrup">Syrup / Extra Shot</label>
        <select id="syrup">
          <option value="None" data-price="0">None</option>
          <option value="Vanilla" data-price="0.70">Vanilla (+ $0.70)</option>
          <option value="Caramel" data-price="0.70">Caramel (+ $0.70)</option>
          <option value="Hazelnut" data-price="0.70">Hazelnut (+ $0.70)</option>
          <option value="Extra Shot" data-price="0.70">Extra Espresso Shot (+ $0.70)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="notes">Special Instructions</label>
        <textarea id="notes" rows="2" placeholder="e.g. Extra hot, half strength..."></textarea>
      </div>

      <div class="total-box">
        <span>Estimated Total:</span>
        <span id="order-total">$0.00</span>
      </div>

      <button type="submit" id="submit-btn">Place Order</button>
    </form>

    <div id="status" class="status-msg"></div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbr9Y6lqD9O_mZf5bC4d-O-c4E4zXv_xS_vG-X8yYvI-vB5_sXvX_s/exec";
    let menuItems = [];

    function populatePickupTimes() {
      const select = document.getElementById("pickupTime");
      const startTime = 8 * 60;
      const endTime = 11 * 60;

      for (let time = startTime; time <= endTime; time += 5) {
        const hours24 = Math.floor(time / 60);
        const minutes = time % 60;
        const period = hours24 >= 12 ? "PM" : "AM";
        const hours12 = hours24 % 12 === 0 ? 12 : hours24 % 12;
        const formattedMinutes = minutes < 10 ? `0${minutes}` : minutes;
        const timeString = `${hours12}:${formattedMinutes} ${period}`;

        const opt = document.createElement("option");
        opt.value = timeString;
        opt.textContent = timeString;
        select.appendChild(opt);
      }
    }

    async function loadMenu() {
      const select = document.getElementById("coffeeType");
      const status = document.getElementById("status");

      try {
        const res = await fetch(APPS_SCRIPT_URL).then(r => r.json());

        if (res.status === "success" && res.items && res.items.length > 0) {
          menuItems = res.items;
          select.innerHTML = '<option value="" data-price="0">-- Select Drink / Item --</option>';
          res.items.forEach(item => {
            const opt = document.createElement("option");
            opt.value = item.name;
            opt.dataset.price = item.price || 0;
            opt.textContent = item.price && parseFloat(item.price) > 0 ? `${item.name} ($${parseFloat(item.price).toFixed(2)})` : item.name;
            select.appendChild(opt);
          });
          if (status) status.textContent = "";
        } else {
          throw new Error(res.message || "No items returned");
        }
      } catch (err) {
        console.error(err);
        if (status) status.textContent = "Failed to load menu options.";
      }
    }

    function updateTotal() {
      const coffeeSelect = document.getElementById("coffeeType");
      const sizeSelect = document.getElementById("size");
      const milkSelect = document.getElementById("milk");
      const syrupSelect = document.getElementById("syrup");

      const itemPrice = parseFloat(coffeeSelect.options[coffeeSelect.selectedIndex]?.dataset.price || 0);
      const sizePrice = parseFloat(sizeSelect.options[sizeSelect.selectedIndex]?.dataset.price || 0);
      const milkPrice = parseFloat(milkSelect.options[milkSelect.selectedIndex]?.dataset.price || 0);
      const syrupPrice = parseFloat(syrupSelect.options[syrupSelect.selectedIndex]?.dataset.price || 0);

      const total = itemPrice + sizePrice + milkPrice + syrupPrice;
      document.getElementById("order-total").textContent = `$${total.toFixed(2)}`;
    }

    ["coffeeType", "size", "milk", "syrup"].forEach(id => {
      document.getElementById(id).addEventListener("change", updateTotal);
    });

    document.getElementById("order-form").addEventListener("submit", async function(e) {
      e.preventDefault();

      const btn = document.getElementById("submit-btn");
      const status = document.getElementById("status");

      btn.disabled = true;
      btn.textContent = "Sending Order...";
      status.textContent = "";

      const orderPayload = {
        customerName: document.getElementById("customerName").value,
        coffeeType: document.getElementById("coffeeType").value,
        size: document.getElementById("size").value,
        pickupTime: document.getElementById("pickupTime").value,
        milk: document.getElementById("milk").value,
        syrup: document.getElementById("syrup").value,
        notes: document.getElementById("notes").value,
        totalPrice: document.getElementById("order-total").textContent
      };

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          redirect: "follow",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(orderPayload)
        });

        const res = await response.json();

        if (res.status === "success") {
          status.className = "status-msg success";
          status.textContent = "✅ Order placed! Payment is due on pick up.";
          document.getElementById("order-form").reset();
          updateTotal();
        } else {
          throw new Error(res.message);
        }
      } catch (err) {
        console.error("Submit error:", err);
        status.className = "status-msg error";
        status.textContent = "❌ Failed to place order. Please try again.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Place Order";
      }
    });

    populatePickupTimes();
    loadMenu();
  </script>
</body>
</html>
