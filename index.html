<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Express - Order</title>

  <!-- Mobile Web App & Home Screen App Tile Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Coffee Express">
  <meta name="application-name" content="Coffee Express">

  <!-- Icons for iOS & Android Home Screen (Make sure you have an apple-touch-icon.png in your repo) -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">

  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #14b8a6; /* Teal accent matching your patch */
      --accent-dark: #0f766e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #2a2a2a;
      --border-color: #333333;
    }

    * { box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background-color: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border: 1px solid var(--border-color);
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header img {
      max-width: 120px;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    h2 {
      margin: 0;
      color: var(--accent);
      font-size: 24px;
      letter-spacing: 0.5px;
    }

    .payment-notice, .hours-info {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* Reorder Banner from your patch */
    .reorder-banner {
      display: none;
      background: var(--accent-dark);
      border: 1px solid var(--accent);
      color: #ccfbf1;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 18px;
      text-align: center;
    }

    .reorder-btn {
      background: var(--accent);
      color: #042f2e;
      border: none;
      padding: 8px 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 8px;
      font-size: 13px;
    }

    .form-group { margin-bottom: 18px; }
    
    label { 
      display: block; 
      font-weight: 600; 
      margin-bottom: 6px; 
      font-size: 14px; 
      color: #e2e8f0; 
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    .btn-add {
      width: 100%;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .btn-submit:disabled {
      background: #555;
      cursor: not-allowed;
    }

    .divider {
      height: 1px;
      background: var(--border-color);
      margin: 20px 0;
    }

    #cart-summary {
      background: var(--input-bg);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding: 8px 0;
    }
    .cart-item:last-child { border-bottom: none; }
    .remove-btn { color: #ef4444; cursor: pointer; border: none; background: none; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <!-- Replace with your actual logo URL or local path -->
    <img src="logo.png" alt="Coffee Express Logo" onerror="this.style.display='none'">
    <h2>Coffee Express</h2>
    <div class="payment-notice">💳 Payment on Pick Up</div>
    <div class="hours-info">📅 Open Tuesday & Thursday mornings (8:00 AM – 11:00 AM) during school terms.</div>
  </header>

  <!-- Re-order Previous Items Banner -->
  <div id="reorderBanner" class="reorder-banner">
    <div id="reorderSummary" style="font-size: 13px;"></div>
    <button type="button" class="reorder-btn" onclick="loadPreviousOrder()">⚡ Load Last Order</button>
  </div>

  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted){completeSubmission();}"></iframe>
  
  <form id="order-form" action="https://script.google.com/macros/s/AKfycbzQQCDOBJMU2YEXtekiww-12uXuoZLwOSRCXsoRDYFIf75uq8OEwK-S7sIW_0PAn-ZJ/exec" method="POST" target="hidden_iframe">

    <div class="form-group">
      <label>Your Name</label>
      <input type="text" id="customerName" name="customerName" required>
    </div>

    <div style="display: flex; gap: 10px;">
      <div class="form-group" style="flex: 1;">
        <label>Date</label>
        <input type="date" id="pickupDate" name="pickupDate" required>
      </div>
      <div class="form-group" style="flex: 1;">
        <label>Time</label>
        <input type="time" id="pickupTime" name="pickupTime" required>
      </div>
    </div>

    <div class="divider"></div>

    <div class="form-group">
      <label>Drink</label>
      <select id="drinkSelect" onchange="populateVariants()"></select>
    </div>

    <div class="form-group">
      <label>Size / Type</label>
      <select id="variantSelect"></select>
    </div>

    <div class="form-group">
      <label>Milk / Sugar / Options</label>
      <input type="text" id="modifiersContainer" placeholder="e.g. Oat milk, 1 sugar, extra hot">
    </div>

    <button type="button" class="btn-add" onclick="addToCart()">+ Add Drink to Order</button>

    <div class="divider"></div>

    <h3 style="margin-top:0; font-size: 16px;">Order Summary</h3>
    <div id="cart-summary">Cart is empty.</div>
    <input type="hidden" id="cartData" name="cartData">

    <div class="form-group">
      <label>Special Instructions</label>
      <textarea id="notes" name="notes" rows="2" placeholder="Leave at counter..."></textarea>
    </div>

    <button type="submit" id="submit-btn" class="btn-submit" onclick="return validateOrder()">Submit Order</button>
  </form>
</div>

<script>
  let cart = [];
  let submitted = false;
  
  // Simulated Loyverse/Menu Items to populate the dropdown
  const items = [
    { name: "Espresso", variants: [{ option_name: "Standard", price: 3.50 }] },
    { name: "Flat White", variants: [{ option_name: "Small", price: 4.50 }, { option_name: "Large", price: 5.50 }] },
    { name: "Cappuccino", variants: [{ option_name: "Small", price: 4.50 }, { option_name: "Large", price: 5.50 }] },
    { name: "Latte", variants: [{ option_name: "Small", price: 4.50 }, { option_name: "Large", price: 5.50 }] },
    { name: "English Breakfast Tea", variants: [{ option_name: "Standard", price: 4.00 }] },
    { name: "Iced Latte", variants: [{ option_name: "Large", price: 6.00 }] }
  ];

  function fetchMenu() {
    const drinkSelect = document.getElementById('drinkSelect');
    items.forEach((item, index) => {
      let opt = document.createElement('option');
      opt.value = index;
      opt.textContent = item.name;
      drinkSelect.appendChild(opt);
    });
    populateVariants();
  }

  function populateVariants() {
    const variantSelect = document.getElementById('variantSelect');
    variantSelect.innerHTML = "";
    const selectedIndex = document.getElementById('drinkSelect').value;
    const item = items[selectedIndex];

    if (item.variants && item.variants.length > 0) {
      variantSelect.disabled = false;
      let defaultSelectIndex = 0;

      item.variants.forEach((v, idx) => {
        const opt = document.createElement("option");
        opt.value = v.option_name;
        opt.dataset.price = v.price;
        
        let labelName = v.option_name;
        if (v.option_name.toLowerCase().includes("small") || v.price === 4.50) {
          labelName = "Small (8oz)";
        } else if (v.option_name.toLowerCase().includes("large") || v.price === 5.50 || v.price === 6) {
          labelName = "Large (12oz)";
          defaultSelectIndex = idx;
        }
        
        opt.textContent = `${labelName} ($${v.price.toFixed(2)})`;
        variantSelect.appendChild(opt);
      });
      // Pre-select Large by default
      variantSelect.selectedIndex = defaultSelectIndex;
    } else {
      variantSelect.disabled = true;
    }
  }

  function addToCart() {
    const drinkIdx = document.getElementById('drinkSelect').value;
    const drinkName = items[drinkIdx].name;
    const variantSelect = document.getElementById('variantSelect');
    const variantName = variantSelect.options[variantSelect.selectedIndex].text;
    const price = parseFloat(variantSelect.options[variantSelect.selectedIndex].dataset.price);
    const mods = document.getElementById('modifiersContainer').value;

    cart.push({
      id: Date.now(),
      drink: drinkName,
      variant: variantName,
      price: price,
      quantity: 1,
      customizations: mods
    });

    document.getElementById('modifiersContainer').value = ""; // Clear notes
    renderCart();
  }

  function renderCart() {
    const summary = document.getElementById('cart-summary');
    const hiddenData = document.getElementById('cartData');
    
    if (cart.length === 0) {
      summary.innerHTML = "Cart is empty.";
      hiddenData.value = "[]";
      return;
    }

    summary.innerHTML = cart.map((item, index) => `
      <div class="cart-item">
        <div>
          <strong>${item.drink}</strong><br>
          <small style="color:#94a3b8">${item.variant} ${item.customizations ? '| ' + item.customizations : ''}</small>
        </div>
        <div>
          <span style="color:#14b8a6; font-weight:bold; margin-right:10px;">$${item.price.toFixed(2)}</span>
          <button type="button" class="remove-btn" onclick="removeItem(${index})">✕</button>
        </div>
      </div>
    `).join("");

    hiddenData.value = JSON.stringify(cart);
  }

  function removeItem(index) {
    cart.splice(index, 1);
    renderCart();
  }

  function checkSavedCustomerData() {
    const savedName = localStorage.getItem('coffee_customer_name');
    const savedCart = localStorage.getItem('coffee_last_cart');

    if (savedName) {
      document.getElementById('customerName').value = savedName;
    }

    if (savedCart) {
      try {
        const parsedCart = JSON.parse(savedCart);
        if (parsedCart.length > 0) {
          const summaryText = parsedCart.map(i => `${i.quantity}x ${i.drink}`).join(', ');
          document.getElementById('reorderSummary').innerHTML = `☕ <strong>Welcome back!</strong> Quick reorder: <em>${summaryText}</em>`;
          document.getElementById('reorderBanner').style.display = 'block';
        }
      } catch (e) {}
    }
  }

  function loadPreviousOrder() {
    const savedCart = localStorage.getItem('coffee_last_cart');
    if (savedCart) {
      try {
        cart = JSON.parse(savedCart);
        // Refresh IDs for modern timestamping
        cart.forEach(item => item.id = Date.now() + Math.random());
        renderCart();
      } catch (e) {}
    }
  }

  function validateOrder() {
    if (cart.length === 0) {
      alert("Please add at least one item to your order before placing it.");
      return false;
    }

    // Save customer name and cart to Local Storage for future visits
    const customer = document.getElementById("customerName").value;
    if (customer) localStorage.setItem('coffee_customer_name', customer);
    if (cart.length > 0) localStorage.setItem('coffee_last_cart', JSON.stringify(cart));

    submitted = true;
    const btn = document.getElementById("submit-btn");
    btn.disabled = true;
    btn.innerText = "Submitting Order...";
    return true; // allows form submission
  }

  function completeSubmission() {
    alert("Order Submitted Successfully!");
    document.getElementById("order-form").reset();
    cart = [];
    renderCart();
    
    // Auto-fill date back to today
    document.getElementById('pickupDate').valueAsDate = new Date();
    checkSavedCustomerData();

    const btn = document.getElementById("submit-btn");
    btn.disabled = false;
    btn.innerText = "Submit Order";
  }

  // Init
  document.getElementById('pickupDate').valueAsDate = new Date();
  fetchMenu();
  checkSavedCustomerData();
</script>

</body>
</html>
