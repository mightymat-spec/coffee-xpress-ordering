<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Express - Order</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --input-bg: #2a2a2a;
      --text-color: #f3f4f6;
      --subtext-color: #9ca3af;
      --accent-color: #14b8a6;
      --accent-hover: #0d9488;
      --danger-color: #ef4444;
      --border-color: #374151;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    h1, h3 {
      margin-top: 0;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--subtext-color);
    }

    input[type="text"],
    input[type="tel"],
    input[type="time"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-color);
      font-size: 15px;
      box-sizing: border-box;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .variants-box {
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 200px;
      overflow-y: auto;
    }

    .variant-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      cursor: pointer;
    }

    .variant-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-add {
      background-color: var(--input-bg);
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
    }

    .btn-add:hover {
      background-color: var(--accent-color);
      color: #fff;
    }

    .btn-submit {
      background-color: var(--accent-color);
      color: #ffffff;
      margin-top: 16px;
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
    }

    .divider {
      height: 1px;
      background-color: var(--border-color);
      margin: 24px 0;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .cart-item-details {
      display: flex;
      flex-direction: column;
    }

    .cart-item-title {
      font-weight: 600;
      font-size: 15px;
    }

    .cart-item-sub {
      font-size: 13px;
      color: var(--subtext-color);
    }

    .cart-item-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cart-item-price {
      font-weight: 600;
      color: var(--accent-color);
    }

    .btn-remove {
      background: none;
      border: none;
      color: var(--danger-color);
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      padding: 0 4px;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
      margin-top: 16px;
    }

    .status-msg {
      font-size: 13px;
      color: var(--subtext-color);
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Coffee Express</h1>
  
  <form id="orderForm" action="https://script.google.com/macros/s/YOUR_APPS_SCRIPT_EXEC_ID/exec" method="POST">
    
    <!-- Customer Details -->
    <div class="form-group">
      <label for="customerName">Name *</label>
      <input type="text" id="customerName" name="name" required placeholder="John Doe">
    </div>

    <div class="form-group">
      <label for="customerPhone">Phone *</label>
      <input type="tel" id="customerPhone" name="phone" required placeholder="0412 345 678">
    </div>

    <div class="form-group">
      <label for="pickupTime">Pickup Time *</label>
      <input type="time" id="pickupTime" name="pickupTime" required>
    </div>

    <div class="divider"></div>

    <!-- Item Selection -->
    <h3>Select Items</h3>
    
    <div class="form-group">
      <label for="itemSelect">Drink / Item</label>
      <select id="itemSelect" onchange="renderItemVariants()">
        <option value="">Loading items from Loyverse...</option>
      </select>
    </div>

    <div class="form-group">
      <label>Variants & Options</label>
      <div id="variantsContainer" class="variants-box">
        <span class="status-msg">Select an item above to view its options.</span>
      </div>
    </div>

    <div class="form-group">
      <label for="quantityInput">Quantity</label>
      <input type="number" id="quantityInput" value="1" min="1" max="20">
    </div>

    <button type="button" class="btn btn-add" onclick="addToCart()">+ Add to Order</button>

    <div class="divider"></div>

    <!-- Cart / Order Summary -->
    <h3>Order Summary</h3>
    <div id="cartSummary"><span class="status-msg">Cart is empty.</span></div>
    
    <!-- Hidden input to submit JSON payload -->
    <input type="hidden" id="cartData" name="cartData" value="[]">

    <div class="form-group" style="margin-top: 16px;">
      <label for="notes">Special Instructions</label>
      <textarea id="notes" name="notes" rows="2" placeholder="e.g. Extra hot, leave at counter..."></textarea>
    </div>

    <button type="submit" class="btn btn-submit" onclick="return validateOrder()">Submit Order</button>
  </form>
</div>

<script>
  // Set your deployed Google Apps Script Web App URL here
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/YOUR_APPS_SCRIPT_EXEC_ID/exec";

  let loyverseItems = [];
  let cart = [];

  // Fetch items strictly from Loyverse endpoint
  async function fetchMenu() {
    const itemSelect = document.getElementById('itemSelect');
    try {
      const response = await fetch(APPS_SCRIPT_URL);
      const data = await response.json();
      loyverseItems = (data && data.items) ? data.items : [];
      
      if (loyverseItems.length === 0) {
        itemSelect.innerHTML = '<option value="">No items found in Loyverse</option>';
        return;
      }
      populateItemDropdown();
    } catch (e) {
      console.error("Failed to fetch Loyverse items:", e);
      itemSelect.innerHTML = '<option value="">Error loading items from Loyverse</option>';
    }
  }

  function populateItemDropdown() {
    const itemSelect = document.getElementById('itemSelect');
    itemSelect.innerHTML = '<option value="">-- Select Item --</option>';
    
    loyverseItems.forEach((item, index) => {
      const opt = document.createElement('option');
      opt.value = index;
      opt.textContent = item.item_name || 'Unnamed Item';
      itemSelect.appendChild(opt);
    });
  }

  // Render options directly from the Loyverse item's variants array
  function renderItemVariants() {
    const itemIndex = document.getElementById('itemSelect').value;
    const container = document.getElementById('variantsContainer');
    container.innerHTML = '';

    if (itemIndex === "") {
      container.innerHTML = '<span class="status-msg">Select an item above to view its options.</span>';
      return;
    }

    const item = loyverseItems[itemIndex];

    if (item && item.variants && item.variants.length > 0) {
      item.variants.forEach((v) => {
        // Resolve variant name directly from Loyverse fields
        let optionName = v.variant_name || '';
        if (!optionName && v.option_values && v.option_values.length > 0) {
          optionName = v.option_values.map(ov => ov.value).join(' / ');
        }
        if (!optionName) optionName = "Option";

        const price = (v.default_price !== undefined && v.default_price !== null) 
          ? parseFloat(v.default_price) 
          : 0;

        const label = document.createElement('label');
        label.className = 'variant-label';
        label.innerHTML = `
          <input type="checkbox" class="variant-checkbox" value="${optionName}" data-price="${price}">
          <span>${optionName} ($${price.toFixed(2)})</span>
        `;
        container.appendChild(label);
      });
    } else {
      container.innerHTML = '<span class="status-msg">No variants available for this item.</span>';
    }
  }

  // Add selected item + options directly into cart
  function addToCart() {
    const itemIndex = document.getElementById('itemSelect').value;
    if (itemIndex === "") {
      alert("Please select an item first.");
      return;
    }

    const item = loyverseItems[itemIndex];
    const qty = parseInt(document.getElementById('quantityInput').value) || 1;

    let selectedVariants = [];
    let totalPricePerUnit = 0;

    const checkedBoxes = document.querySelectorAll('.variant-checkbox:checked');
    
    checkedBoxes.forEach(cb => {
      selectedVariants.push(cb.value);
      totalPricePerUnit += parseFloat(cb.dataset.price) || 0;
    });

    // If no option is checked, default to base variant price from Loyverse
    if (checkedBoxes.length === 0 && item.variants && item.variants[0]) {
      totalPricePerUnit = parseFloat(item.variants[0].default_price) || 0;
    }

    const itemTotal = totalPricePerUnit * qty;

    cart.push({
      id: Date.now(),
      name: item.item_name,
      variants: selectedVariants.length > 0 ? selectedVariants.join(', ') : 'Standard',
      quantity: qty,
      unitPrice: totalPricePerUnit,
      totalPrice: itemTotal
    });

    // Reset fields
    document.getElementById('itemSelect').value = "";
    document.getElementById('quantityInput').value = 1;
    renderItemVariants();
    renderCart();
  }

  // Remove item from cart array
  function removeItem(index) {
    cart.splice(index, 1);
    renderCart();
  }

  // Render cart list and sync hidden input value
  function renderCart() {
    const cartSummary = document.getElementById('cartSummary');
    const cartDataInput = document.getElementById('cartData');

    if (cart.length === 0) {
      cartSummary.innerHTML = '<span class="status-msg">Cart is empty.</span>';
      cartDataInput.value = "[]";
      return;
    }

    let grandTotal = 0;
    cartSummary.innerHTML = cart.map((item, idx) => {
      grandTotal += item.totalPrice;
      return `
        <div class="cart-item">
          <div class="cart-item-details">
            <span class="cart-item-title">${item.quantity}x ${item.name}</span>
            <span class="cart-item-sub">${item.variants}</span>
          </div>
          <div class="cart-item-right">
            <span class="cart-item-price">$${item.totalPrice.toFixed(2)}</span>
            <button type="button" class="btn-remove" onclick="removeItem(${idx})" title="Remove Item">✕</button>
          </div>
        </div>
      `;
    }).join('') + `
      <div class="cart-total">
        <span>Total:</span>
        <span style="color: var(--accent-color);">$${grandTotal.toFixed(2)}</span>
      </div>
    `;

    cartDataInput.value = JSON.stringify(cart);
  }

  function validateOrder() {
    if (cart.length === 0) {
      alert("Your cart is empty! Please add at least one item before submitting.");
      return false;
    }
    return true;
  }

  window.addEventListener('DOMContentLoaded', fetchMenu);
</script>

</body>
</html>
