<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Express - Order Online</title>
  <style>
    :root {
      --primary: #4a2c2a;
      --accent: #d4a373;
      --bg: #fefae0;
      --text: #333333;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h1 {
      color: var(--primary);
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: var(--primary);
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    .cart-section {
      border-top: 2px solid var(--accent);
      padding-top: 15px;
      margin-top: 20px;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #faedcd;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
      font-weight: bold;
    }
    button:hover {
      background-color: #36201e;
    }
    .add-btn {
      background-color: var(--accent);
      color: #000;
      margin-top: 8px;
    }
    #statusMessage {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>☕ Coffee Express</h1>
  
  <form id="orderForm">
    <div class="form-group">
      <label for="customerName">Full Name</label>
      <input type="text" id="customerName" required placeholder="John Doe">
    </div>

    <div class="form-group">
      <label for="pickupDate">Pickup Date</label>
      <input type="date" id="pickupDate" required>
    </div>

    <div class="form-group">
      <label for="pickupTime">Pickup Time</label>
      <input type="time" id="pickupTime" required>
    </div>

    <div class="cart-section">
      <h3>Select Your Drinks</h3>
      <div class="form-group">
        <label for="drinkSelect">Drink Item</label>
        <select id="drinkSelect">
          <option value="Espresso" data-price="3.50">Espresso - $3.50</option>
          <option value="Flat White" data-price="4.50">Flat White - $4.50</option>
          <option value="Cappuccino" data-price="4.50">Cappuccino - $4.50</option>
          <option value="Latte" data-price="4.50">Latte - $4.50</option>
          <option value="Long Black" data-price="4.00">Long Black - $4.00</option>
        </select>
      </div>

      <div class="form-group">
        <label for="drinkVariant">Size / Milk Option</label>
        <select id="drinkVariant">
          <option value="Regular Full Cream">Regular (Full Cream)</option>
          <option value="Regular Skim">Regular (Skim)</option>
          <option value="Large Oat (+0.50)">Large Oat Milk</option>
          <option value="Large Almond (+0.50)">Large Almond Milk</option>
        </select>
      </div>

      <div class="form-group">
        <label for="customizations">Custom Notes (e.g. Extra Shot, 1 Sugar)</label>
        <input type="text" id="customizations" placeholder="Extra hot, 1 sugar">
      </div>

      <button type="button" class="add-btn" onclick="addToCart()">Add Drink to Order</button>
    </div>

    <div class="cart-section">
      <h3>Your Items</h3>
      <div id="cartList">No items added yet.</div>
    </div>

    <div class="form-group" style="margin-top: 15px;">
      <label for="notes">Special Order Instructions</label>
      <textarea id="notes" rows="2" placeholder="Leave at pickup counter"></textarea>
    </div>

    <button type="submit" id="submitBtn">Submit Order to POS</button>
  </form>

  <div id="statusMessage"></div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzQQCDOBJMU2YEXtekiww-12uXuoZLwOSRCXsoRDYFIf75uq8OEwK-S7sIW_0PAn-ZJ/exec"; 
  let cart = [];

  // Set default pickup date to today
  document.getElementById('pickupDate').valueAsDate = new Date();

  function addToCart() {
    const drinkSelect = document.getElementById('drinkSelect');
    const drinkName = drinkSelect.value;
    const price = parseFloat(drinkSelect.options[drinkSelect.selectedIndex].getAttribute('data-price'));
    const variant = document.getElementById('drinkVariant').value;
    const customizations = document.getElementById('customizations').value;

    cart.push({
      drink: drinkName,
      variant: variant,
      quantity: 1,
      unitPrice: price,
      customizations: customizations
    });

    renderCart();
    document.getElementById('customizations').value = '';
  }

  function renderCart() {
    const cartList = document.getElementById('cartList');
    if (cart.length === 0) {
      cartList.innerHTML = 'No items added yet.';
      return;
    }

    cartList.innerHTML = cart.map((item, index) => `
      <div class="cart-item">
        <div>
          <strong>${item.drink}</strong> (${item.variant})<br>
          <small>${item.customizations || 'Standard'}</small> - $${item.unitPrice.toFixed(2)}
        </div>
        <button type="button" style="width: auto; background: #bc4749;" onclick="removeItem(${index})">✕</button>
      </div>
    `).join('');
  }

  function removeItem(index) {
    cart.splice(index, 1);
    renderCart();
  }

  document.getElementById('orderForm').addEventListener('submit', function(e) {
    e.preventDefault();
    if (cart.length === 0) {
      alert("Please add at least one drink to your order.");
      return;
    }

    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMessage');
    submitBtn.disabled = true;
    statusMsg.innerText = "Submitting order to Loyverse...";

    const formData = new FormData();
    formData.append('customerName', document.getElementById('customerName').value);
    formData.append('pickupDate', document.getElementById('pickupDate').value);
    formData.append('pickupTime', document.getElementById('pickupTime').value);
    formData.append('notes', document.getElementById('notes').value);
    formData.append('cartData', JSON.stringify(cart));

    fetch(SCRIPT_URL, {
      method: 'POST',
      body: formData
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === 'success') {
        let msg = " Order Sent to Loyverse Open Tickets!";
        if (data.rewardApplied) {
          msg += " 🎁 6th Drink Free Reward Applied!";
        }
        statusMsg.style.color = "green";
        statusMsg.innerText = msg;
        cart = [];
        renderCart();
        document.getElementById('orderForm').reset();
      } else {
        throw new Error(data.message);
      }
    })
    .catch(err => {
      statusMsg.style.color = "red";
      statusMsg.innerText = "Error: " + err.message;
    })
    .finally(() => {
      submitBtn.disabled = false;
    });
  });
</script>
</body>
</html>
