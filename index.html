<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Express - Order</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      margin: 0;
      padding: 20px;
      color: #f8fafc;
    }
    .order-card {
      max-width: 500px;
      margin: 20px auto;
      background: #1e293b;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid #334155;
    }
    .brand-header { text-align: center; margin-bottom: 20px; }
    .gemco-joint-logo {
      width: 100%;
      max-width: 380px;
      height: auto;
      display: block;
      margin: 0 auto 12px auto;
      background: #ffffff;
      padding: 10px 16px;
      border-radius: 8px;
    }
    h2 { margin: 8px 0 0 0; color: #ffffff; font-size: 24px; }
    .charity-banner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #162e21;
      border: 1px solid #22c55e;
      color: #4ade80;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .acnc-tick-img {
      height: 48px;
      width: auto;
      background: #ffffff;
      padding: 2px;
      border-radius: 50%;
    }
    .payment-notice {
      background: #0284c7;
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .hours-info {
      background: #334155;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 20px;
      text-align: center;
    }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; color: #e2e8f0; }
    input, select, textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #ffffff;
      border-radius: 8px;
      font-size: 15px;
    }
    .total-box {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 14px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 18px;
      color: #38bdf8;
      margin-bottom: 20px;
    }
    button {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled { background: #64748b; }
    .status-msg { margin-top: 15px; text-align: center; font-weight: 600; }
    .success { color: #4ade80; }
    .error { color: #f87171; }
  </style>
</head>
<body>

  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

  <div class="order-card">
    <div class="brand-header">
      <img src="GEM_placeHolder_logo_V22.jpg" alt="Gemco Players" class="gemco-joint-logo">
      <h2>Coffee Express</h2>
    </div>

    <div class="charity-banner">
      <img src="ACNC-Registered-Charity-Logo_RGB.png" alt="ACNC Charity" class="acnc-tick-img">
      <span>All proceeds support the Gem Community Arts Centre</span>
    </div>

    <div class="payment-notice">💳 Payment on Pick Up</div>
    <div class="hours-info">📅 Open Tuesday & Thursday mornings (8:00 AM – 11:00 AM) during school terms.</div>

    <form id="order-form" action="https://script.google.com/macros/s/AKfycbyPGbb6wVaFi8ZU3RRC1EPtJyaCypUJ_FM9xq_v4zBzlql-J5jfhyeorWy4gPA1Qu06/exec" method="POST" target="hidden_iframe">
      
      <div class="form-group">
        <label for="customerName">Your Name</label>
        <input type="text" id="customerName" name="customerName" required placeholder="Enter your name">
      </div>

      <div class="form-group">
        <label for="coffeeType">Coffee / Drink Type</label>
        <select id="coffeeType" name="coffeeType" required>
          <option value="" data-price="0">-- Select Drink --</option>
          <option value="Espresso" data-price="3">Espresso ($3.00)</option>
          <option value="Cappuccino" data-price="4">Cappuccino ($4.00)</option>
          <option value="Latte" data-price="4.5">Latte ($4.50)</option>
          <option value="Americano" data-price="3.5">Americano ($3.50)</option>
          <option value="Cold Brew" data-price="4.5">Cold Brew ($4.50)</option>
          <option value="Iced Latte" data-price="4.75">Iced Latte ($4.75)</option>
          <option value="Croissant" data-price="3.25">Croissant ($3.25)</option>
          <option value="Muffin" data-price="3">Muffin ($3.00)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="size">Size</label>
        <select id="size" name="size" required>
          <option value="Small (8oz)" data-price="0">Small (8oz)</option>
          <option value="Large (12oz)" data-price="1.00">Large (12oz) (+ $1.00)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="pickupTime">Pickup Time (8:00 AM – 11:00 AM)</label>
        <select id="pickupTime" name="pickupTime" required>
          <option value="">-- Select Pickup Time --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="milk">Milk Choice</label>
        <select id="milk" name="milk">
          <option value="Full Cream" data-price="0">Full Cream</option>
          <option value="Skim Milk" data-price="0">Skim Milk</option>
          <option value="Oat Milk" data-price="0.70">Oat Milk (+ $0.70)</option>
          <option value="Almond Milk" data-price="0.70">Almond Milk (+ $0.70)</option>
          <option value="Soy Milk" data-price="0.70">Soy Milk (+ $0.70)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="syrup">Syrup / Extra Shot</label>
        <select id="syrup" name="syrup">
          <option value="None" data-price="0">None</option>
          <option value="Vanilla" data-price="0.70">Vanilla (+ $0.70)</option>
          <option value="Caramel" data-price="0.70">Caramel (+ $0.70)</option>
          <option value="Hazelnut" data-price="0.70">Hazelnut (+ $0.70)</option>
          <option value="Extra Shot" data-price="0.70">Extra Espresso Shot (+ $0.70)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="notes">Special Instructions</label>
        <textarea id="notes" name="notes" rows="2" placeholder="e.g. Extra hot..."></textarea>
      </div>

      <input type="hidden" id="totalPriceInput" name="totalPrice" value="$0.00">

      <div class="total-box">
        <span>Estimated Total:</span>
        <span id="order-total">$0.00</span>
      </div>

      <button type="submit" id="submit-btn">Place Order</button>
    </form>

    <div id="status" class="status-msg"></div>
  </div>

  <script>
    let submitted = false;

    function populatePickupTimes() {
      const select = document.getElementById("pickupTime");
      for (let time = 8 * 60; time <= 11 * 60; time += 5) {
        const hours24 = Math.floor(time / 60);
        const minutes = time % 60;
        const period = hours24 >= 12 ? "PM" : "AM";
        const hours12 = hours24 % 12 === 0 ? 12 : hours24 % 12;
        const formattedMinutes = minutes < 10 ? `0${minutes}` : minutes;
        const opt = document.createElement("option");
        opt.value = `${hours12}:${formattedMinutes} ${period}`;
        opt.textContent = opt.value;
        select.appendChild(opt);
      }
    }

    function updateTotal() {
      const coffee = document.getElementById("coffeeType");
      const size = document.getElementById("size");
      const milk = document.getElementById("milk");
      const syrup = document.getElementById("syrup");

      const total = 
        parseFloat(coffee.options[coffee.selectedIndex]?.dataset.price || 0) +
        parseFloat(size.options[size.selectedIndex]?.dataset.price || 0) +
        parseFloat(milk.options[milk.selectedIndex]?.dataset.price || 0) +
        parseFloat(syrup.options[syrup.selectedIndex]?.dataset.price || 0);

      const formatted = `$${total.toFixed(2)}`;
      document.getElementById("order-total").textContent = formatted;
      document.getElementById("totalPriceInput").value = formatted;
    }

    ["coffeeType", "size", "milk", "syrup"].forEach(id => {
      document.getElementById(id).addEventListener("change", updateTotal);
    });

    document.getElementById("order-form").addEventListener("submit", function() {
      submitted = true;
      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      btn.textContent = "Sending Order...";
    });

    document.getElementById("hidden_iframe").addEventListener("load", function() {
      if (submitted) {
        const status = document.getElementById("status");
        status.className = "status-msg success";
        status.textContent = "✅ Order placed successfully! Payment is due on pickup.";
        document.getElementById("order-form").reset();
        updateTotal();
        const btn = document.getElementById("submit-btn");
        btn.disabled = false;
        btn.textContent = "Place Order";
        submitted = false;
      }
    });

    populatePickupTimes();
    updateTotal();
  </script>
</body>
</html>
