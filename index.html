<!DOCTYPE html>
<html lang="en">
<head><img src="GEM_placeHolder_logo_V22.png" alt="Gemco Players" class="gemco-joint-logo">
    .gemco-joint-logo
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Express - Order</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      margin: 0;
      padding: 20px;
      color: #f8fafc;
    }
    .order-card {
      max-width: 500px;
      margin: 20px auto;
      background: #1e293b;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid #334155;
    }
    .brand-header { text-align: center; margin-bottom: 20px; } {
      width: 100%;
      max-width: 380px;
      height: auto;
      display: block;
      margin: 0 auto 12px auto;
      background: #ffffff;
      padding: 10px 16px;
      border-radius: 8px;
    }
    h2 { margin: 8px 0 0 0; color: #ffffff; font-size: 24px; }
    .charity-banner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #162e21;
      border: 1px solid #22c55e;
      color: #4ade80;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }
   .acnc-tick-img {<img src="ACNC-Registered-Charity-Logo_RGB.png" alt="ACNC Charity" class="acnc-tick-img">
  height: 40px;
  width: auto;
  max-width: 40px;
  object-fit: contain;
  background: #ffffff;
  padding: 2px;
  border-radius: 50%;
  flex-shrink: 0;
}
    }
    .payment-notice {
      background: #0284c7;
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .hours-info {
      background: #334155;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 20px;
      text-align: center;
    }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; color: #e2e8f0; }
    input, select, textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #ffffff;
      border-radius: 8px;
      font-size: 15px;
    }
    .total-box {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 14px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 18px;
      color: #38bdf8;
      margin-bottom: 20px;
    }
    button {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled { background: #64748b; }
    .status-msg { margin-top: 15px; text-align: center; font-weight: 600; }
    .success { color: #4ade80; }
  </style>
</head>
<body>

  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

  <div class="order-card">
    <div class="brand-header">
      <img src="GEM_placeHolder_logo_V2.png" alt="Gemco Players" class="gemco-joint-logo">
      <h2>Coffee Express</h2>
    </div>

    <div class="charity-banner">
      <img src="ACNC-Registered-Charity-Logo_RGB.png" alt="ACNC Charity" class="acnc-tick-img">
      <span>All proceeds support the Gem Community Arts Centre</span>
    </div>

    <div class="payment-notice">💳 Payment on Pick Up</div>
    <div class="hours-info">📅 Open Tuesday & Thursday mornings (8:00 AM – 11:00 AM) during school terms.</div>

    <form id="order-form" action="https://script.google.com/macros/s/AKfycbzQQCDOBJMU2YEXtekiww-12uXuoZLwOSRCXsoRDYFIf75uq8OEwK-S7sIW_0PAn-ZJ/exec" method="POST" target="hidden_iframe">
      
      <div class="form-group">
        <label for="customerName">Your Name</label>
        <input type="text" id="customerName" name="customerName" required placeholder="Enter your name">
      </div>

      <div class="form-group">
        <label for="categorySelect">Category</label>
        <select id="categorySelect">
          <option value="">-- Select Category --</option>
          <option value="hot">Hot Drinks</option>
          <option value="cold">Cold Drinks</option>
        </select>
      </div>

      <div class="form-group">
        <label for="coffeeType">Drink Item</label>
        <select id="coffeeType" name="coffeeType" required disabled>
          <option value="" data-price="0">-- Select Category First --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="variant">Variant / Size</label>
        <select id="variant" name="variant" disabled>
          <option value="" data-price="0">-- Select Drink First --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="modifier1" id="mod1-label">Customization 1</label>
        <select id="modifier1" name="modifier1">
          <option value="None" data-price="0">None</option>
        </select>
      </div>

      <div class="form-group">
        <label for="modifier2" id="mod2-label">Customization 2</label>
        <select id="modifier2" name="modifier2">
          <option value="None" data-price="0">None</option>
        </select>
      </div>

      <div class="form-group">
        <label for="pickupTime">Pickup Time (8:00 AM – 11:00 AM)</label>
        <select id="pickupTime" name="pickupTime" required>
          <option value="">-- Select Pickup Time --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="notes">Special Instructions</label>
        <textarea id="notes" name="notes" rows="2" placeholder="e.g. Extra hot..."></textarea>
      </div>

      <input type="hidden" id="totalPriceInput" name="totalPrice" value="$0.00">

      <div class="total-box">
        <span>Estimated Total:</span>
        <span id="order-total">$0.00</span>
      </div>

      <button type="submit" id="submit-btn">Place Order</button>
    </form>

    <div id="status" class="status-msg"></div>
  </div>

  <script>
    let submitted = false;
    let loyverseMenu = { hotDrinks: [], coldDrinks: [], modifiers: [] };

    function renderLoyverseData(data) {
      if (data && data.status === "success") {
        loyverseMenu = data;
        
        // Populate Modifiers from Loyverse
        if (data.modifiers.length > 0) {
          populateModifier("modifier1", "mod1-label", data.modifiers[0]);
        }
        if (data.modifiers.length > 1) {
          populateModifier("modifier2", "mod2-label", data.modifiers[1]);
        }
      }
    }

    function populateModifier(elementId, labelId, modifier) {
      const select = document.getElementById(elementId);
      const label = document.getElementById(labelId);
      label.textContent = modifier.name;
      select.innerHTML = '<option value="None" data-price="0">None</option>';
      modifier.options.forEach(opt => {
        const o = document.createElement("option");
        o.value = opt.name;
        o.dataset.price = opt.price;
        o.textContent = `${opt.name} (${opt.price > 0 ? '+$' + opt.price.toFixed(2) : 'Free'})`;
        select.appendChild(o);
      });
    }

    document.getElementById("categorySelect").addEventListener("change", function() {
      const cat = this.value;
      const drinkSelect = document.getElementById("coffeeType");
      const variantSelect = document.getElementById("variant");
      
      drinkSelect.innerHTML = '<option value="" data-price="0">-- Select Drink --</option>';
      variantSelect.innerHTML = '<option value="" data-price="0">-- Select Drink First --</option>';
      variantSelect.disabled = true;

      const items = cat === "hot" ? loyverseMenu.hotDrinks : (cat === "cold" ? loyverseMenu.coldDrinks : []);
      if (items.length > 0) {
        drinkSelect.disabled = false;
        items.forEach((item, index) => {
          const opt = document.createElement("option");
          opt.value = item.name;
          opt.dataset.index = index;
          opt.textContent = item.name;
          drinkSelect.appendChild(opt);
        });
      } else {
        drinkSelect.disabled = true;
      }
      updateTotal();
    });

    document.getElementById("coffeeType").addEventListener("change", function() {
      const cat = document.getElementById("categorySelect").value;
      const items = cat === "hot" ? loyverseMenu.hotDrinks : loyverseMenu.coldDrinks;
      const selectedIndex = this.options[this.selectedIndex]?.dataset.index;
      const variantSelect = document.getElementById("variant");

      variantSelect.innerHTML = '';
      if (selectedIndex !== undefined && items[selectedIndex]) {
        const item = items[selectedIndex];
        if (item.variants && item.variants.length > 0) {
          variantSelect.disabled = false;
          item.variants.forEach(v => {
            const opt = document.createElement("option");
            opt.value = v.option_name;
            opt.dataset.price = v.price;
            opt.textContent = `${v.option_name} ($${v.price.toFixed(2)})`;
            variantSelect.appendChild(opt);
          });
        }
      } else {
        variantSelect.disabled = true;
      }
      updateTotal();
    });

    function fetchMenu() {
      const script = document.createElement("script");
      script.src = "https://script.google.com/macros/s/AKfycbzQQCDOBJMU2YEXtekiww-12uXuoZLwOSRCXsoRDYFIf75uq8OEwK-S7sIW_0PAn-ZJ/exec?callback=renderLoyverseData";
      document.body.appendChild(script);
    }

    function populatePickupTimes() {
      const select = document.getElementById("pickupTime");
      for (let time = 8 * 60; time <= 11 * 60; time += 5) {
        const hours24 = Math.floor(time / 60);
        const minutes = time % 60;
        const period = hours24 >= 12 ? "PM" : "AM";
        const hours12 = hours24 % 12 === 0 ? 12 : hours24 % 12;
        const formattedMinutes = minutes < 10 ? `0${minutes}` : minutes;
        const opt = document.createElement("option");
        opt.value = `${hours12}:${formattedMinutes} ${period}`;
        opt.textContent = opt.value;
        select.appendChild(opt);
      }
    }

    function updateTotal() {
      const variant = document.getElementById("variant");
      const mod1 = document.getElementById("modifier1");
      const mod2 = document.getElementById("modifier2");

      const total = 
        parseFloat(variant.options[variant.selectedIndex]?.dataset.price || 0) +
        parseFloat(mod1.options[mod1.selectedIndex]?.dataset.price || 0) +
        parseFloat(mod2.options[mod2.selectedIndex]?.dataset.price || 0);

      const formatted = `$${total.toFixed(2)}`;
      document.getElementById("order-total").textContent = formatted;
      document.getElementById("totalPriceInput").value = formatted;
    }

    ["variant", "modifier1", "modifier2"].forEach(id => {
      document.getElementById(id).addEventListener("change", updateTotal);
    });

    document.getElementById("order-form").addEventListener("submit", function() {
      submitted = true;
      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      btn.textContent = "Sending Order...";
    });

    document.getElementById("hidden_iframe").addEventListener("load", function() {
      if (submitted) {
        const status = document.getElementById("status");
        status.className = "status-msg success";
        status.textContent = "✅ Order placed successfully! Payment is due on pickup.";
        document.getElementById("order-form").reset();
        updateTotal();
        const btn = document.getElementById("submit-btn");
        btn.disabled = false;
        btn.textContent = "Place Order";
        submitted = false;
      }
    });

    populatePickupTimes();
    fetchMenu();
  </script>
</body>
</html>
