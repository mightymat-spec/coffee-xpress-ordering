<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coffee Xpress - Order</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 40px 16px;
    display: flex;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 32px;
    width: 100%;
    max-width: 480px;
  }
  h1 {
    font-size: 26px;
    margin: 0 0 24px 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  label.field-label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
    margin-top: 20px;
    font-size: 15px;
  }
  input[type="text"], textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #d8d8d8;
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 70px; }
  .grid2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .option {
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid #d8d8d8;
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    font-weight: 600;
    font-size: 15px;
  }
  .option input { accent-color: #4f6bff; width: 16px; height: 16px; }
  .option:has(input:checked) { border-color: #4f6bff; background: #f0f3ff; }
  button#submitBtn {
    width: 100%;
    margin-top: 28px;
    background: #4f6bff;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  button#submitBtn:disabled { opacity: 0.6; cursor: default; }
  #statusMsg {
    margin-top: 16px;
    text-align: center;
    font-weight: 600;
  }
  #statusMsg.success { color: #1a8754; }
  #statusMsg.error { color: #c0392b; }
</style>
</head>
<body>
  <div class="card">
    <h1>☕ Coffee Xpress</h1>
    <form id="orderForm">
      <label class="field-label" for="name">Your name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required>

      <label class="field-label">Coffee type</label>
      <div class="grid2" id="coffeeGroup">
        <label class="option"><input type="radio" name="coffee" value="espresso" checked> Espresso</label>
        <label class="option"><input type="radio" name="coffee" value="cappuccino"> Cappuccino</label>
        <label class="option"><input type="radio" name="coffee" value="latte"> Latte</label>
        <label class="option"><input type="radio" name="coffee" value="flat white"> Flat white</label>
        <label class="option"><input type="radio" name="coffee" value="americano"> Americano</label>
        <label class="option"><input type="radio" name="coffee" value="macchiato"> Macchiato</label>
      </div>

      <label class="field-label">Size</label>
      <div class="grid2" id="sizeGroup">
        <label class="option"><input type="radio" name="size" value="8oz" checked> 8oz small</label>
        <label class="option"><input type="radio" name="size" value="12oz"> 12oz large</label>
      </div>

      <label class="field-label" for="notes">Notes (optional)</label>
      <textarea id="notes" name="notes" placeholder="e.g. oat milk, extra hot"></textarea>

      <button type="submit" id="submitBtn">Place order</button>
      <div id="statusMsg"></div>
    </form>
  </div>

    var name = document.getElementById('name').value.trim();

<script>
  // Replace this URL with your actual Google Apps Script Web App URL
  var SCRIPT_URL = 'https://coffee.gemcoplayers.org/';
  
  var form = document.getElementById('orderForm');
  var statusMsg = document.getElementById('statusMsg');
  var submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    var name = document.getElementById('name').value.trim();
    var coffee = form.querySelector('input[name="coffee"]:checked').value;
    var size = form.querySelector('input[name="size"]:checked').value;
    var notes = document.getElementById('notes').value.trim();

    var payload = {
      customerName: name,
      coffee: coffee,
      size: size,
      notes: notes,
      timestamp: new Date().toISOString()
    };

    submitBtn.disabled = true;
    statusMsg.className = '';
    statusMsg.textContent = 'Placing your order...';

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors', // Bypasses CORS blocking for Google Apps Script
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    })
    .then(function() {
      statusMsg.className = 'success';
      statusMsg.textContent = 'Order placed! See you soon, ' + name + '.';
      setTimeout(function() {
        form.reset();
        statusMsg.textContent = '';
        statusMsg.className = '';
        submitBtn.disabled = false;
      }, 2000);
    })
    .catch(function(err) {
      statusMsg.className = 'error';
      statusMsg.textContent = 'Something went wrong. Please try again.';
      submitBtn.disabled = false;
    });
  });
</script>
</script>
</body>
</html>
